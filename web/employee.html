<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpcycleConnect — Espace salarié</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="employee">
    <div class="dashboard">
        <aside class="sidebar">
            <a class="brand" href="index.html">
                <span class="brand-mark">↻</span>
                <span>UpcycleConnect</span>
            </a>
            <nav>
                <a href="index.html">Accueil</a>
                <a href="user.html">Utilisateur</a>
                <a href="pro.html">Professionnel</a>
                <a class="active" href="employee.html">Salarié</a>
                <a href="admin.html">Administration</a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <div class="dashboard-top">
                <div>
                    <p class="eyebrow">ESPACE SALARIÉ</p>
                    <h1>Espace salarié</h1>
                    <p class="muted">Aujourd'hui : <span data-current-date></span></p>
                </div>
                <div class="avatar">SA</div>
            </div>

            <section class="stats-grid" id="employee-stats">
                <article class="stat-card"><span class="label">Chargement…</span><strong>—</strong></article>
            </section>

            <div class="dashboard-grid">
                <section class="panel">
                    <h2>Mes prochaines activités</h2>
                    <div class="list" id="employee-activities"><div class="list-item"><small>Chargement…</small></div></div>
                    <div class="action-row">
                        <button class="small-button" data-demo-action="Création d'une formation (soumise à validation)">Créer une formation</button>
                    </div>
                </section>
                <section class="panel">
                    <h2>À traiter</h2>
                    <div class="list" id="employee-tasks"><div class="list-item"><small>Chargement…</small></div></div>
                    <div class="action-row">
                        <button class="small-button" data-demo-action="Accès à la modération du forum">Modérer le forum</button>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
