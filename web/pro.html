<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpcycleConnect — Espace professionnel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="pro">
    <div class="dashboard">
        <aside class="sidebar">
            <a class="brand" href="index.html">
                <span class="brand-mark">↻</span>
                <span>UpcycleConnect</span>
            </a>
            <nav>
                <a href="index.html">Accueil</a>
                <a href="user.html">Utilisateur</a>
                <a class="active" href="pro.html">Professionnel</a>
                <a href="employee.html">Salarié</a>
                <a href="admin.html">Administration</a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <div class="dashboard-top">
                <div>
                    <p class="eyebrow">ESPACE PROFESSIONNEL & ARTISAN</p>
                    <h1>Tableau de bord professionnel</h1>
                    <p class="muted">Aujourd'hui : <span data-current-date></span></p>
                </div>
                <div class="avatar">PR</div>
            </div>

            <section class="stats-grid" id="pro-stats">
                <article class="stat-card"><span class="label">Chargement…</span><strong>—</strong></article>
            </section>

            <div class="dashboard-grid">
                <section class="panel">
                    <h2>Objets à récupérer</h2>
                    <div class="list" id="pro-items"><div class="list-item"><small>Chargement…</small></div></div>
                    <div class="action-row">
                        <button class="small-button" data-demo-action="Scan du code-barres (à connecter)">Scanner un code-barres</button>
                    </div>
                </section>
                <section class="panel">
                    <h2>Mes projets d'upcycling</h2>
                    <div class="list" id="pro-projects"><div class="list-item"><small>Chargement…</small></div></div>
                    <div class="action-row">
                        <button class="small-button" data-demo-action="Gestion des contrats et facturation (à connecter)">Contrats & facturation</button>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
