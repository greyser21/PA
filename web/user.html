<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpcycleConnect — Espace particulier</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="user">
    <div class="dashboard">
        <aside class="sidebar">
            <a class="brand" href="index.html">
                <span class="brand-mark">↻</span>
                <span>UpcycleConnect</span>
            </a>
            <nav>
                <a href="index.html">Accueil</a>
                <a class="active" href="user.html">Utilisateur</a>
                <a href="pro.html">Professionnel</a>
                <a href="employee.html">Salarié</a>
                <a href="admin.html">Administration</a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <div class="dashboard-top">
                <div>
                    <p class="eyebrow">ESPACE PARTICULIER</p>
                    <h1 id="user-greeting">Bonjour, <span id="user-name">…</span></h1>
                    <p class="muted">Aujourd'hui : <span data-current-date></span></p>
                </div>
                <div class="avatar" id="user-avatar">EU</div>
            </div>

            <section class="stats-grid" id="user-stats">
                <article class="stat-card"><span class="label">Chargement…</span><strong>—</strong></article>
            </section>

            <div class="dashboard-grid">
                <section class="panel">
                    <h2>Mes dernières annonces</h2>
                    <div class="list" id="user-announcements"><div class="list-item"><small>Chargement des annonces…</small></div></div>
                    <div class="action-row">
                        <button class="small-button" id="btn-new-announcement" data-demo-action="Ouverture du formulaire d'annonce">Déposer une annonce</button>
                    </div>
                </section>
                <section class="panel">
                    <h2>Prochaines activités</h2>
                    <div class="list" id="user-activities"><div class="list-item"><small>Chargement des activités…</small></div></div>
                    <div class="action-row">
                        <button class="small-button" id="btn-deposit" data-demo-action="Demande de dépôt envoyée au service Check">Demander un dépôt (conteneur)</button>
                    </div>
                </section>
            </div>

            <section class="panel" style="margin-top:20px;">
                <h2>Nouvelle annonce (don ou vente)</h2>
                <form id="announcement-form" class="inline-form">
                    <input type="text" name="title" placeholder="Titre de l'objet" required>
                    <select name="type" required>
                        <option value="don">Don</option>
                        <option value="vente">Vente</option>
                    </select>
                    <input type="text" name="location" placeholder="Localisation">
                    <input type="text" name="price" placeholder="Prix (si vente)">
                    <button type="submit" class="small-button">Publier (validation requise)</button>
                </form>
                <p class="muted" id="announcement-feedback"></p>
            </section>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
