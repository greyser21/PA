<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpcycleConnect — Back-office</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin">
    <div class="dashboard">
        <aside class="sidebar">
            <a class="brand" href="index.html">
                <span class="brand-mark">↻</span>
                <span>UpcycleConnect</span>
            </a>
            <nav>
                <a href="index.html">Accueil</a>
                <a href="user.html">Utilisateur</a>
                <a href="pro.html">Professionnel</a>
                <a href="employee.html">Salarié</a>
                <a class="active" href="admin.html">Administration</a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <div class="dashboard-top">
                <div>
                    <p class="eyebrow">ADMINISTRATION GÉNÉRALE</p>
                    <h1>Back-office</h1>
                    <p class="muted">Aujourd'hui : <span data-current-date></span></p>
                </div>
                <div class="avatar">AD</div>
            </div>

            <section class="stats-grid" id="admin-stats">
                <article class="stat-card"><span class="label">Chargement…</span><strong>—</strong></article>
            </section>

            <div class="dashboard-grid">
                <section class="panel">
                    <h2>Actions prioritaires</h2>
                    <div class="list" id="admin-actions"><div class="list-item"><small>Chargement…</small></div></div>
                    <div class="action-row">
                        <button class="small-button" data-demo-action="Validation des éléments en attente">Valider les éléments</button>
                    </div>
                </section>
                <section class="panel">
                    <h2>Activité récente</h2>
                    <div class="list" id="admin-activity"><div class="list-item"><small>Chargement…</small></div></div>
                    <div class="action-row">
                        <button class="small-button" data-demo-action="Gestion financière et catalogue">Gestion & catalogue</button>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
